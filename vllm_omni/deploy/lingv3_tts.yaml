# LingV3-TTS: Bailing-v3 AR+flow stage -> streaming AudioVAE stage
pipeline: lingv3_tts
async_chunk: true
trust_remote_code: false
dtype: bfloat16
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      latent_chunk_size: 25
      initial_latent_chunk_size: 4
      latent_left_context: 0

stages:
  - stage_id: 0
    # For now, the CFM CUDA graph is captured lazily per batch size.
    max_num_seqs: 4
    gpu_memory_utilization: 0.60
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 8192
    max_model_len: 8192
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 801
      detokenize: true

  - stage_id: 1
    # AudioVAE KV, upsampler, and ISTFT state are keyed by request_id.
    max_num_seqs: 4
    gpu_memory_utilization: 0.25
    enforce_eager: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 8192
    max_model_len: 8192
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      detokenize: false
