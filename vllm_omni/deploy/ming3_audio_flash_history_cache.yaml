# Opt-in native full-attention KV and aligned KDA-state reuse for audio history.
base_config: ming3_audio_flash_history.yaml

stages:
  - stage_id: 0
    enable_prefix_caching: true
    enable_chunked_prefill: true
    engine_extras:
      mamba_cache_mode: align
  - stage_id: 1
    enable_prefix_caching: false
