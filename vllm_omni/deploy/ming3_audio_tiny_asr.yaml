# Ming-3.0-audio-tiny ASR: original two-stage deployment with 10-gram blocking.
#
# Stage 0 runs on 1 GPU. Stage 1 shares GPU 0 for the
# self-contained Qwen2 + CFM + AudioVAE talker. Use the thinker-only profile
# when only ASR / Speech-QA text is required.
pipeline: bailing_moe_v3_audio
async_chunk: true
trust_remote_code: false
distributed_executor_backend: mp
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    disable_custom_all_reduce: true
    logits_processors:
      - vllm_omni.model_executor.logits_processor:NoRepeatNGramLogitsProcessor
    max_num_seqs: 1
    max_model_len: 131072
    max_num_batched_tokens: 32768
    gpu_memory_utilization: 0.78
    enforce_eager: false
    async_scheduling: false
    compilation_config:
      cudagraph_mode: FULL_AND_PIECEWISE
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true
      ignore_eos: false
      extra_args:
        no_repeat_ngram_size: 10

  - stage_id: 1
    devices: "0"
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    gpu_memory_utilization: 0.18
    enforce_eager: false
    compilation_config:
      mode: 0
      cudagraph_mode: NONE
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

# Native CUDA Bailing/KDA kernels are required.
platforms: {}
