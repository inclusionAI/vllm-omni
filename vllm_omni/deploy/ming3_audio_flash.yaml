# Ming-3.0-audio-flash: single-stage long-context ASR.
#
# Memory-minimum baseline for four 80 GB-class CUDA devices. It favors
# reliable bring-up over concurrency; benchmark before enabling graphs or EP.
pipeline: bailing_moe_v3_audio
async_chunk: false
trust_remote_code: false
distributed_executor_backend: mp
dtype: bfloat16
enable_prefix_caching: false
enable_chunked_prefill: true

stages:
  - stage_id: 0
    devices: "0,1,2,3"
    tensor_parallel_size: 4
    enable_expert_parallel: false
    max_num_seqs: 1
    max_model_len: 8192
    max_num_batched_tokens: 2048
    gpu_memory_utilization: 0.92
    enforce_eager: true
    async_scheduling: false
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 256
      detokenize: true
      ignore_eos: false

# Native CUDA Bailing/KDA kernels are required.
platforms: {}
